<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="FINDER — trova il tuo prossimo find da STOCK & FOUND 88.">
<title>FINDER — STOCK & FOUND 88</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=88.6">
<link rel="stylesheet" href="v6.css?v=88.6">
</head>
<body data-page="finder">
<div id="header"></div>
<main class="v6-finder-page">
<section class="v6-finder">
<div class="wrap">
<div class="line"><span>STOCK & FOUND 88 / FINDER</span><span>THE HUNT</span></div>
<div class="v6-finder-grid">
<div>
<div class="eyebrow">WHAT ARE YOU LOOKING FOR?</div>
<h1 class="v6-finder-title">FIND<br><em>YOUR PIECE.</em></h1>
</div>
<div class="v6-finder-copy">
<p>Categoria, budget, brand. Parti da un indizio e lascia che la caccia faccia il resto.</p>
<form class="v6-finder-form" id="finderPageForm">
<label>CATEGORY<select id="pageCat"><option value="">ANY CATEGORY</option><option value="Men">MEN</option><option value="Women">WOMEN</option><option value="Kids">KIDS</option><option value="Shoes">SHOES</option><option value="Accessories">ACCESSORIES</option></select></label>
<label>MAX PRICE<select id="pagePrice"><option value="">ANY PRICE</option><option value="30">UNDER €30</option><option value="50">UNDER €50</option><option value="80">UNDER €80</option><option value="120">UNDER €120</option></select></label>
<label class="full">BRAND / PRODUCT / KEYWORD<input id="pageQuery" type="search" placeholder="Try: sneakers, denim, Nike..."></label>
<div class="full"><button class="btn dark" type="submit">START THE HUNT ↗</button><div class="v6-finder-result" id="pageResult"></div></div>
</form>
</div>
</div>
</div>
</section>
<section class="v6-huntband"><div class="wrap v6-hunt-grid"><div><div class="eyebrow" style="color:#77736d">FOUND DIFFERENTLY</div><h2>WE GO<br>LOOKING.<br><em>YOU FIND.</em></h2></div><div><p>Lo stock cambia. I pezzi cambiano. La caccia continua.</p><a class="btn light" href="shop.html">ENTER THE HUNT ↗</a></div></div></section>
</main>
<div id="footer"></div>
<div id="overlay" class="overlay" onclick="closeCart()"></div>
<aside id="cart" class="cart"></aside>
<script src="js/app.js?v=88.6"></script>
<script src="js/personality.js?v=88.6"></script>
<script src="js/v5-interaction-fix.js?v=88.6"></script>
<script src="js/v6.js?v=88.6"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 const f=document.querySelector('#finderPageForm');
 f.onsubmit=e=>{
   e.preventDefault();
   const cat=document.querySelector('#pageCat').value;
   const under=document.querySelector('#pagePrice').value;
   const q=document.querySelector('#pageQuery').value.trim();
   if(q)sessionStorage.setItem('sf88_finder_query',q);
   const p=[];
   if(cat)p.push('cat='+encodeURIComponent(cat));
   if(under)p.push('under='+encodeURIComponent(under));
   document.querySelector('#pageResult').textContent='OPENING THE HUNT…';
   setTimeout(()=>location.href='shop.html'+(p.length?'?'+p.join('&'):''),160);
 };
});
</script>
</body></html>
